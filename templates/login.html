<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

<style>
    * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            /* background-image: url(static/images/trek_image.png); */
            background-image: linear-gradient(
                rgba(0,0,0,0.45),
                rgba(0, 0, 0, 0.45)
            ),
            url("static/images/trek_image.png");

            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

    .login-box {
        width: 350px;
        margin: 100px auto;
        padding: 25px;
        background-color: rgba(255, 255, 255, 0.503);
        border-radius: 10px;
        box-shadow: 0 0 10px gray;
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    .remember {
        margin-top: 15px;
    }

    .remember input {
        width: auto;
    }

    button {
       width: 100%;
       padding: 10px;
       margin-top: 15px;
       background-color: green;
       color: white;
       border: none;
       border-radius: 5px;
       cursor: pointer;
       font-size: 16px;
    }

    button:hover {
        background-color: darkgreen;
    }

    .register-link {
        text-align: center;
        margin-top: 15px;
    }

    .register-link a {
        color: green;
        text-decoration: none;
        font-weight: bold;
    }

    #message {
        width: 320px;
        margin: 10px auto;
        padding: 10px;
        background-color: #fff3cd;
        color: #856404;
        border: 1px solid #ffeeba;
        border-radius: 8px;
        text-align: center;
        font-weight: bold;
    }
    </style>
</head>
<body>

    <div class="login-box">

        <h2>Login</h2>

        <!-- invalid credentials message -->
        {% if message %}
        <p id="message" >{{ message }}</p>
        {% endif %}

        <form method="POST" action="/login">

            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email" required>
        
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>

            <button type="submit">Login</button>

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="/register">Register</a>
        </div>

    </div>

</body>
</html>
